name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows executable
        run: dotnet publish .\WallpaperProfiles.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\release-output

      - name: Create GitHub release and upload executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\release-output\Belie.exe --generate-notes
